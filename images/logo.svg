<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bgPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.25)"/>
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.1)"/>
    </linearGradient>
  </defs>

  <!-- Modern Geometric Tech Icon -->
  <g transform="translate(4, 8)">
    <!-- Outer Hex Shield -->
    <polygon points="28,2 52,16 52,40 28,54 4,40 4,16" 
             stroke="url(#logoGrad)" stroke-width="2.5" 
             fill="url(#bgPill)" stroke-linejoin="round"/>
    
    <!-- Core Gear/Quantum Ring -->
    <circle cx="28" cy="28" r="9" stroke="url(#accentGrad)" stroke-width="1.8" fill="none"/>
    <circle cx="28" cy="28" r="4.5" fill="url(#logoGrad)"/>
    
    <!-- Satellite Nodes -->
    <circle cx="28" cy="11" r="3" fill="#38BDF8"/>
    <circle cx="13" cy="37" r="3" fill="#8B5CF6"/>
    <circle cx="43" cy="37" r="3" fill="#06B6D4"/>
    
    <!-- Connection Rays -->
    <line x1="28" y1="14" x2="28" y2="19" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="15" y1="35" x2="20" y2="32" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="41" y1="35" x2="36" y2="32" stroke="#06B6D4" stroke-width="1.5"/>
  </g>

  <!-- Typography -->
  <g transform="translate(68, 12)">
    <!-- Main Acronym Title -->
    <text x="0" y="27" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="26" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      ICRAERM
    </text>
    <!-- Year Badge -->
    <text x="136" y="27" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="22" font-weight="800" fill="url(#accentGrad)">
      '27
    </text>
    <!-- Subtitle -->
    <text x="1" y="44" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="8.5" font-weight="700" letter-spacing="2.2" fill="#94A3B8">
      ENGINEERING &amp; MANAGEMENT
    </text>
  </g>
</svg>
